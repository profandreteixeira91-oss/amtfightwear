# Evolution API v2 (WhatsApp da loja) — VPS com Docker.
# Sobe: Evolution API + PostgreSQL + Redis + Caddy (HTTPS automático via Let's Encrypt).
# Uso: copie .env.example para .env, ajuste e rode `docker compose up -d`.

services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - evolution_instances:/evolution/instances
    networks: [evolution]
    # Sem porta publicada: o acesso externo passa só pelo Caddy (HTTPS).

  postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [evolution]

  redis:
    image: redis:7
    container_name: evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [evolution]

  caddy:
    image: caddy:2
    container_name: evolution_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EVOLUTION_DOMAIN: ${EVOLUTION_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - evolution
    networks: [evolution]

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  caddy_data:

networks:
  evolution:
